[package]
name = "pledgestrike"
version = "0.0.1"
edition = "2024"
authors = ["PledgeCyber <contact@pledgecyber.com>"]
license = "MIT"
description = "All-in-one offensive security toolkit with 120+ attack modules covering web exploitation, infrastructure testing, credential attacks, cloud/container, supply chain, OT/ICS, IoT, and network protocols"
repository = "https://github.com/pledgeandgrow/pledgestrike"
homepage = "https://github.com/pledgeandgrow/pledgestrike"
documentation = "https://github.com/pledgeandgrow/pledgestrike/blob/main/MODULE.md"
readme = "README.md"
keywords = ["security", "pentesting", "offensive-security", "vulnerability", "web-security"]
categories = ["command-line-utilities", "development-tools::testing"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
colored = "2.1"
rayon = "1.10"
anyhow = "1.0"
chrono = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2.5"
rand = "0.8"
ratatui = "0.30"
crossterm = "0.28"
tui-input = "0.15"
regex = "1.10"
rustls = "0.23"
webpki-roots = "0.26"
x509-parser = "0.16"
hickory-resolver = "0.26"
urlencoding = "2.1"

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1.40", features = ["full", "test-util"] }
